services:
  tgbackup:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: khalid-tgbackup:latest
    container_name: khalid_tgbackup
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,time,datetime as d;h=json.load(open('/app/data/heartbeat.json'));sys.exit(0 if h['status']=='ok' and time.time()-d.datetime.fromisoformat(h['ts']).timestamp()<120 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchdog:
    image: khalid-tgbackup:latest
    container_name: khalid_tgbackup_watchdog
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    command: ["python", "watchdog.py"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - tgbackup
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
